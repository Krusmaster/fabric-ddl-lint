[project]
name = "fabric-ddl-lint"
version = "0.1.0"
description = "Lint T-SQL for Microsoft Fabric Warehouse compatibility before deploy"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Gustav Kruse" }]
keywords = ["microsoft-fabric", "t-sql", "lint", "data-engineering"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Database",
]

[project.scripts]
fabric-ddl-lint = "fabric_ddl_lint:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["fabric_ddl_lint"]
